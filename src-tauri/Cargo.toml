[package]
name = "logic-architecture-studio"
version.workspace = true
edition.workspace = true
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
serde.workspace = true
tauri-runtime-wry = "=2.12.3"
tauri = { version = "2", features = ["unstable"] }
serde_json.workspace = true
studio-service = { path = "../crates/studio-service" }
studio-renderer = { path = "../crates/renderer" }
design-core = { path = "../crates/design-core" }

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "=0.15.4", default-features = false }
