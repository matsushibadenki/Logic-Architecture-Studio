[workspace]
exclude = ["vendor/unge"]
members = ["crates/design-core", "crates/studio-service", "crates/renderer", "src-tauri"]
default-members = ["crates/design-core", "crates/studio-service"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
